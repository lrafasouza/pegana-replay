[package]
name        = "pegana-replay-cli"
# Tracks the methodology crate version (0.3.0): the CLI's verify-identity is
# pegana_methodology::methodology_version(), so the published CLI version must
# equal the methodology version it embeds, else the install hint in
# main.rs (VERSION_MISMATCH → "install --version <methodology_version>")
# points at a release that doesn't exist. See docs/.../10-distribution.md §8.
version     = "0.3.0"
edition     = "2021"
description = "Reproduce and verify a Pegana alert from its public receipt."
license     = "MIT"
repository  = "https://github.com/lrafasouza/pegana"
keywords    = ["pegana", "audit", "verify", "solana"]
categories  = ["command-line-utilities"]

[[bin]]
name = "pegana-replay"
path = "src/main.rs"

[dependencies]
pegana-methodology   = { path = "../methodology" }
# Public carve-out (replaces pegana-common). The replay CLI only touches the
# verifier-safe types (AssetsFile parsing, AlertEvidence deserialization);
# server-side primitives stay in the closed pegana-common crate.
pegana-common-verify = { path = "../common-verify" }
clap               = { version = "4", features = ["derive", "env"] }
reqwest            = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow             = { workspace = true }
similar            = "2"
uuid               = { workspace = true }
solana-client            = { workspace = true }
solana-sdk               = { workspace = true }
# Wave 8 review fix: needed for --verify-onchain memo decode (JsonParsed encoding).
solana-transaction-status = "2"

[dev-dependencies]
tempfile     = "3"
chrono       = { workspace = true }
rust_decimal = { workspace = true }
toml         = { workspace = true }
