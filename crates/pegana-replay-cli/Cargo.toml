[package]
name        = "pegana-replay-cli"
# Tracks the methodology crate version (0.4.0): the CLI's verify-identity is
# pegana_methodology::methodology_version(), so the published CLI version must
# equal the methodology version it embeds. Engine now emits 0.4.0 receipts
# (verified live 2026-06-16), so a v0.4.0 verifier RELEASE must be cut on
# pegana-replay for the public to verify current receipts — see the release
# runbook. Until then the installer still ships v0.2.0 (verifies older receipts).
version     = "0.4.0"
edition     = "2021"
description = "Verifies a Pegana alert's canonical receipt hash and its signer-pinned on-chain anchor — tamper-evidence without re-executing the methodology."
license     = "MIT"
repository  = "https://github.com/lrafasouza/pegana-replay"
keywords    = ["pegana", "audit", "verify", "solana"]
categories  = ["command-line-utilities"]

[[bin]]
name = "pegana-replay"
path = "src/main.rs"

[dependencies]
pegana-methodology   = { path = "../methodology" }
# Public carve-out (replaces pegana-common). The replay CLI only touches the
# verifier-safe types (AssetsFile parsing, AlertEvidence deserialization);
# server-side primitives stay in the closed pegana-common crate.
pegana-common-verify = { path = "../common-verify" }
clap               = { version = "4", features = ["derive", "env"] }
reqwest            = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow             = { workspace = true }
similar            = "2"
uuid               = { workspace = true }
solana-client            = { workspace = true }
solana-sdk               = { workspace = true }
# Wave 8 review fix: needed for --verify-onchain memo decode (JsonParsed encoding).
solana-transaction-status = "2"

[dev-dependencies]
tempfile     = "3"
chrono       = { workspace = true }
rust_decimal = { workspace = true }
toml         = { workspace = true }
