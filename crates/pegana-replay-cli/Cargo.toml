[package]
name        = "pegana-replay-cli"
# CLI release version. The CLI's verify-IDENTITY is the embedded
# `pegana_methodology::methodology_version()` (= 0.4.0), NOT this crate version —
# verify() matches receipt.methodology_version against that embedded value.
# v0.4.1 DELIBERATELY DECOUPLES the CLI release version from the methodology
# version (F-13b, 2026-06-21): this binary embeds methodology 0.4.0 (so it
# verifies ALL existing v1 history) AND adds schema-v2 re-derivation. Bumping
# methodology itself would VERSION_MISMATCH every historical 0.4.0 receipt, so
# methodology stays 0.4.0 and only the CLI patch-bumps. The installer fetches the
# LATEST release (no longer methodology-pinned) so `curl|sh` ships this binary.
version     = "0.4.1"
edition     = "2021"
description = "Verifies a Pegana alert's canonical receipt hash and its signer-pinned on-chain anchor (tamper-evidence for every receipt), and independently re-derives the verdict from the frozen inputs for schema-v2 receipts."
license     = "MIT"
repository  = "https://github.com/lrafasouza/pegana-replay"
keywords    = ["pegana", "audit", "verify", "solana"]
categories  = ["command-line-utilities"]

[[bin]]
name = "pegana-replay"
path = "src/main.rs"

[dependencies]
pegana-methodology   = { path = "../methodology" }
# Public carve-out (replaces pegana-common). The replay CLI only touches the
# verifier-safe types (AssetsFile parsing, AlertEvidence deserialization);
# server-side primitives stay in the closed pegana-common crate.
pegana-common-verify = { path = "../common-verify" }
clap               = { version = "4", features = ["derive", "env"] }
reqwest            = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow             = { workspace = true }
similar            = "2"
uuid               = { workspace = true }
solana-client            = { workspace = true }
solana-sdk               = { workspace = true }
# Wave 8 review fix: needed for --verify-onchain memo decode (JsonParsed encoding).
solana-transaction-status = "2"

[dev-dependencies]
tempfile     = "3"
chrono       = { workspace = true }
rust_decimal = { workspace = true }
toml         = { workspace = true }
